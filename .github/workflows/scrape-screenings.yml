name: Scrape theater showtimes

on:
  # Every 6 hours
  schedule:
    - cron: '17 */6 * * *'

  # "Run workflow" button on the Actions tab
  workflow_dispatch:

  # Re-scrape right away when the scraper itself changes
  push:
    branches: [main]
    paths:
      - 'scraper.js'
      - 'scrapers/**'
      - 'data/venues.json'
      - 'package.json'
      - '.github/workflows/scrape-screenings.yml'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run scraper
        run: npm run scrape

      - name: Report theater status
        if: always()
        run: |
          node -e '
            const s = require("./data/status.json");
            const rows = Object.entries(s.venues).map(([id, v]) =>
              `| ${id} | ${v.status === "ok" ? "✅ ok" : "⚠️ " + v.status} | ${v.count} | ${v.message || ""} |`);
            console.log(["### Theater status", "", "| Theater | Status | Showtimes | Note |", "|---|---|---|---|", ...rows].join("\n"));
            const bad = Object.entries(s.venues).filter(([, v]) => v.status === "error" || v.status === "stale");
            if (bad.length) console.log("\n::warning::Scraper needs attention for: " + bad.map(([id]) => id).join(", "));
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add data/screenings.json data/status.json data/tmdb-cache.json data/venue-meta-cache.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update screenings data [automated]"
            git pull --rebase --autostash
            git push
          fi
